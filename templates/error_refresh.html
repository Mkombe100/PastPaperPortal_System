<!DOCTYPE html>
<html>
<head>
    <title>Something went wrong</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
            background: #f5f5f5;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 20px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Something went wrong</h2>
    <p>Please refresh the page</p>

    <button onclick="window.location.reload()">🔄 Refresh</button>
</div>

</body>
</html>
