<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .box {
            background: white;
            padding: 30px 20px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 100%;
            width: 100%;
        }
        
        @media (min-width: 480px) {
            .box {
                padding: 40px 30px;
                max-width: 420px;
            }
        }
        
        h2 {
            margin: 0 0 12px 0;
            font-size: 1.6rem;
        }
        
        p {
            margin: 0 0 25px 0;
            color: #555;
            font-size: 1rem;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            max-width: 200px;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        @media (max-width: 480px) {
            h2 {
                font-size: 1.4rem;
            }
            
            .box {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Welcome Mzumbe PastPaper Portal</h2>
    <p></p>

    <button onclick="window.location.reload()">View</button>
</div>

</body>
</html>
